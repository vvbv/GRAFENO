name: Release

on:
  push:
    branches:
      - main
    paths:
      - "src/grafeno/__init__.py"
      - "pyproject.toml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Detect version bump
        id: version
        run: |
          NEW_VERSION="$(python -c "import sys; sys.path.insert(0, 'src'); from grafeno import __version__; print(__version__)")"
          OLD_VERSION="$(git show HEAD~1:src/grafeno/__init__.py | sed -n 's/^__version__ = \"\(.*\)\"/\1/p')"
          echo "Version anterior: ${OLD_VERSION:-<ninguna>} - Nueva: $NEW_VERSION"
          if [ -z "$OLD_VERSION" ] || [ "$OLD_VERSION" = "$NEW_VERSION" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "value=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        if: steps.version.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify built artifacts version
        if: steps.version.outputs.changed == 'true'
        run: |
          EXPECTED="${{ steps.version.outputs.value }}"
          SDIST="dist/grafeno-${EXPECTED}.tar.gz"
          WHEEL="dist/grafeno-${EXPECTED}-py3-none-any.whl"
          if [ ! -f "$SDIST" ] || [ ! -f "$WHEEL" ]; then
            echo "::error::Los artefactos no llevan la version de __init__.py ($EXPECTED):"
            ls -la dist/
            exit 1
          fi
          echo "Artefactos OK: $SDIST $WHEEL"

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.value }}" dist/* --title "v${{ steps.version.outputs.value }}" --generate-notes
