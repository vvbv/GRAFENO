asyncapi: 3.0.0
info:
  title: GRAFENO Remote WebSocket API
  version: 1.8.0
  description: |
    Bidirectional JSON-RPC channel exposed on `/api/v1/ws` (implemented by
    hand on RFC 6455, see `src/grafeno/server/ws.py`). The HTTP GET upgrade
    uses the same OPTIONAL token as the REST endpoints (`Authorization:
    Bearer <token>` or `?token=`); when no tokens are configured (the
    default) the upgrade is anonymous. The credential is dedicated to this
    server and never shared with the Telegram bot. Client frames must be
    masked; server frames are unmasked; text frames carry UTF-8 JSON.
    Messages over 1 MiB close the socket. Ping is answered with Pong by
    the server itself.

    Commands are JSON-RPC style requests `{"id","method","params"}` and
    each gets exactly one response: `{"id","result":...}` on success or
    `{"id","error":{"message","status?","code?"}}` on failure (`id` echoes the
    request id, `null` when the input was not valid JSON). The available
    methods mirror the REST endpoints one to one:
    | Method              | Params                                           | REST equivalent                    |
    | status              | -                                                | GET /api/v1/status                 |
    | time                | -                                                | GET /api/v1/time                   |
    | tasks.list          | `state?`, `workdir?`, `project?`, `sort?`, ...    | GET /api/v1/tasks                  |
    | tasks.get           | `task_id`                                        | GET /api/v1/tasks/{id}             |
    | projects.list       | -                                                | GET /api/v1/projects               |
    | projects.create     | `name?`, `url?`, `mode?`, `workspace?`           | POST /api/v1/projects              |
    | projects.docs       | `workdir?`, `project?`                           | GET /api/v1/projects/docs          |
    | projects.doc        | `workdir?`, `project?`, `name`, `offset?`, `max_chars?` | GET /api/v1/projects/doc    |
    | tasks.logs          | `task_id`, `limit?` (1..1000, default 200)      | GET /api/v1/tasks/{id}/logs        |
    | tasks.artifacts     | `task_id`, `kind`, `cycle?` (default 1)         | GET /api/v1/tasks/{id}/artifacts   |
    | tasks.create        | `name`, `workdir`, `description?`, `automode?`, `parent_id?`, `scheduled_at?`, `origin?`, `profile?`, `attachments?` (optional list of {name, data-base64}, max 10; limited by the 1 MiB message cap) | POST /api/v1/tasks |
    | tasks.start         | `task_id`                                        | POST /api/v1/tasks/{id}/start      |
    | tasks.resume        | `task_id` (FAILED only)                          | POST /api/v1/tasks/{id}/resume     |
    | tasks.restart       | `task_id`                                        | POST /api/v1/tasks/{id}/restart    |
    | tasks.pause         | `task_id`                                        | POST /api/v1/tasks/{id}/pause      |
    | tasks.discard       | `task_id`                                        | POST /api/v1/tasks/{id}/discard    |
    | tasks.mark_done     | `task_id`                                        | POST /api/v1/tasks/{id}/mark-done  |
    | tasks.extend        | `task_id`, `request`, `attachments?`             | POST /api/v1/tasks/{id}/extend     |
    | tasks.reset         | `task_id`                                        | POST /api/v1/tasks/{id}/reset      |
    | tasks.run           | `task_id`, `phase` (plan/implement/review/fix/final/tests/automode) | POST /api/v1/tasks/{id}/run |
    | tasks.continue      | `task_id`                                        | POST /api/v1/tasks/{id}/continue   |
    | tasks.approve_plan  | `task_id`                                        | POST /api/v1/tasks/{id}/approve-plan |
    | tasks.edit          | `task_id`, `name?`, `description?`, `parent_id?` | POST /api/v1/tasks/{id}/edit       |
    | tasks.roles         | `task_id`, `roles?`, `profile?`                  | POST /api/v1/tasks/{id}/roles      |
    | tasks.artifact      | `task_id`, `kind`, `path`                        | GET /api/v1/tasks/{id}/artifact    |
    | tasks.media         | `task_id`, `name` (result: `{name, mime, data}` base64; files above 16 MiB return a 413 error: use GET /api/v1/tasks/{id}/media) | GET /api/v1/tasks/{id}/media |
    | tasks.attachments   | `task_id`                                        | GET /api/v1/tasks/{id}/attachments |
    | tasks.attach        | `task_id`, `attachments` (base64; 1 MiB per WS message, for larger files use the REST raw upload) | POST /api/v1/tasks/{id}/attachments |
    | tasks.detach        | `task_id`, `file`                                | DELETE /api/v1/tasks/{id}/attachments |
    | sessions.list       | `workdir?`                                       | GET /api/v1/sessions               |
    | sessions.get        | `session_id`                                     | GET /api/v1/sessions/{id}          |
    | sessions.transcript | `session_id`, `after?`, `limit?`                 | GET /api/v1/sessions/{id}/transcript |
    | sessions.create     | `workdir`, `cli?`, `model?`, `effort?`, `name?`, `prompt?` | POST /api/v1/sessions    |
    | sessions.send       | `session_id`, `prompt`                           | POST /api/v1/sessions/{id}/send    |
    | sessions.cancel     | `session_id`                                     | POST /api/v1/sessions/{id}/cancel  |
    | sessions.edit       | `session_id`, `name`                             | POST /api/v1/sessions/{id}/edit    |
    | sessions.close      | `session_id`                                     | POST /api/v1/sessions/{id}/close   |
    | sessions.reopen     | `session_id`                                     | POST /api/v1/sessions/{id}/reopen  |
    | sessions.delete     | `session_id`                                     | DELETE /api/v1/sessions/{id}       |
    | projects.repos      | `workdir?`, `project?` | GET /api/v1/projects/repos |
    | projects.changes    | `workdir?`, `project?`, `refresh?` | GET /api/v1/projects/changes |
    | projects.branches   | `workdir?`, `project?`, `repo?` | GET /api/v1/projects/branches |
    | projects.push       | `workdir?`, `project?`, `repo?`, `set_upstream?`, `remote?` | POST /api/v1/projects/push |
    | projects.pull       | `workdir?`, `project?`, `repo?`, `mode?` | POST /api/v1/projects/pull |
    | projects.checkout   | `workdir?`, `project?`, `repo?`, `branch` | POST /api/v1/projects/checkout |
    | projects.abort      | `workdir?`, `project?`, `repo?` | POST /api/v1/projects/abort |
    | reviews.list        | `workdir?`, `state?` | GET /api/v1/reviews |
    | reviews.start       | `workdir?`, `project?`, `task_id?`, `name?`, `cli?`, `model?`, `effort?`, `resume?` | POST /api/v1/reviews |
    | reviews.get         | `review_id` | GET /api/v1/reviews/{id} |
    | reviews.delete      | `review_id` | DELETE /api/v1/reviews/{id} |
    | reviews.close       | `review_id` | POST /api/v1/reviews/{id}/close |
    | reviews.reopen      | `review_id` | POST /api/v1/reviews/{id}/reopen |
    | reviews.files       | `review_id`, `repo?`, `decision?` | GET /api/v1/reviews/{id}/files |
    | reviews.diff        | `review_id`, `repo`+`path` or `key`, `max_bytes?` | GET /api/v1/reviews/{id}/diff |
    | reviews.navigate    | `review_id`, `action`, `repo?`, `path?`, `key?`, `skip_decided?`, `diff?` | POST /api/v1/reviews/{id}/navigate |
    | reviews.decide      | `review_id`, file, `decision`, `note?`, `advance?` | POST /api/v1/reviews/{id}/decision |
    | reviews.discuss     | `review_id`, `message`, file? | POST /api/v1/reviews/{id}/discuss |
    | reviews.request_changes | `review_id`, file, `instructions` | POST /api/v1/reviews/{id}/request-changes |
    | reviews.transcript  | `review_id`, `after?`, `limit?` | GET /api/v1/reviews/{id}/transcript |
    | reviews.cancel      | `review_id` | POST /api/v1/reviews/{id}/cancel |
    | reviews.commit_message | `review_id`, `files`, `hint?`, `cli?`, `model?`, `effort?` | POST /api/v1/reviews/{id}/commit-message |
    | reviews.commit      | `review_id`, `files`, `message`, `include_unstaged?`, `allow_multi_repo?` | POST /api/v1/reviews/{id}/commit |
    | reviews.commits     | `review_id` | GET /api/v1/reviews/{id}/commits |
    | options.get         | -                                                | GET /api/v1/options                |
    | models.list         | `refresh?`                                       | GET /api/v1/models                 |
    | fs.dirs             | `path?`                                          | GET /api/v1/fs/dirs                |
    | issues.list         | `workdir`                                        | GET /api/v1/issues                 |
    | reports.get         | `period?`, `from?`, `to?`                        | GET /api/v1/reports                |
    | settings.get        | -                                                | GET /api/v1/settings               |
    | settings.update     | settings sections                                | POST /api/v1/settings              |
    | subscribe           | `topics` (list of strings, `tasks`, `sessions` and `reviews` supported)    | -                                  |
    | unsubscribe         | -                                                | -                                  |

    After `subscribe {"topics":["tasks"]}`, every task whose `state`
    changes is pushed as a `task.changed` event carrying the same
    `TaskSummary` shape as the REST list endpoint. The server polls the
    on-disk task store every 2 s (signature of every `task.toml`: mtime +
    size); the snapshot is kept fresh even with no subscribers, so a new
    client is never spammed with the backlog.

    After `subscribe {"topics":["sessions"]}`, direct CLI session changes
    are pushed as `session.changed` (carrying the `CliSessionSummary`) and
    `session.deleted` (carrying `session_id`) events. Transcript entries
    are not pushed: poll `sessions.transcript` with `after`.

    After `subscribe {"topics":["reviews"]}`, review changes are pushed as
    `review.changed` (carrying the `ReviewSummary`) and `review.deleted`
    (carrying `review_id`) events. Review errors carry a stable `code` in
    the `error` object (e.g. `not_pending`, `stale`, `multi_repo`, `busy`).
servers:
  local:
    host: 127.0.0.1:8735
    pathname: /api/v1/ws
    protocol: ws
    protocolVersion: "13"
    security:
      - $ref: "#/components/securitySchemes/BearerAuth"
      - $ref: "#/components/securitySchemes/QueryToken"
channels:
  control:
    address: /api/v1/ws
    messages:
      command:
        $ref: "#/components/messages/Command"
      result:
        $ref: "#/components/messages/Result"
      errorResult:
        $ref: "#/components/messages/ErrorResult"
      taskChanged:
        $ref: "#/components/messages/TaskChanged"
      sessionChanged:
        $ref: "#/components/messages/SessionChanged"
      sessionDeleted:
        $ref: "#/components/messages/SessionDeleted"
      reviewChanged:
        $ref: "#/components/messages/ReviewChanged"
      reviewDeleted:
        $ref: "#/components/messages/ReviewDeleted"
operations:
  sendCommand:
    action: send
    title: Client sends a JSON-RPC command
    channel:
      $ref: "#/channels/control"
    messages:
      - $ref: "#/channels/control/messages/command"
  receiveResult:
    action: receive
    title: Server answers each command with result or error
    channel:
      $ref: "#/channels/control"
    messages:
      - $ref: "#/channels/control/messages/result"
      - $ref: "#/channels/control/messages/errorResult"
  receiveTaskChanged:
    action: receive
    title: Server pushes state changes to `tasks` subscribers
    channel:
      $ref: "#/channels/control"
    messages:
      - $ref: "#/channels/control/messages/taskChanged"
  receiveSessionEvents:
    action: receive
    title: Server pushes CLI session changes to `sessions` subscribers
    channel:
      $ref: "#/channels/control"
    messages:
      - $ref: "#/channels/control/messages/sessionChanged"
      - $ref: "#/channels/control/messages/sessionDeleted"
  receiveReviewEvents:
    action: receive
    title: Server pushes review changes to `reviews` subscribers
    channel:
      $ref: "#/channels/control"
    messages:
      - $ref: "#/channels/control/messages/reviewChanged"
      - $ref: "#/channels/control/messages/reviewDeleted"
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
    QueryToken:
      type: httpApiKey
      in: query
      name: token
  schemas:
    MethodEnum:
      type: string
      enum:
        - status
        - time
        - tasks.list
        - tasks.get
        - projects.list
        - projects.create
        - projects.docs
        - projects.doc
        - tasks.logs
        - tasks.artifacts
        - tasks.create
        - tasks.start
        - tasks.resume
        - tasks.restart
        - tasks.pause
        - tasks.discard
        - tasks.mark_done
        - tasks.extend
        - tasks.reset
        - tasks.run
        - tasks.continue
        - tasks.approve_plan
        - tasks.edit
        - tasks.roles
        - tasks.artifact
        - tasks.media
        - tasks.attachments
        - tasks.attach
        - tasks.detach
        - sessions.list
        - sessions.get
        - sessions.transcript
        - sessions.create
        - sessions.send
        - sessions.cancel
        - sessions.edit
        - sessions.close
        - sessions.reopen
        - sessions.delete
        - projects.repos
        - projects.changes
        - projects.branches
        - projects.push
        - projects.pull
        - projects.checkout
        - projects.abort
        - reviews.list
        - reviews.start
        - reviews.get
        - reviews.delete
        - reviews.close
        - reviews.reopen
        - reviews.files
        - reviews.diff
        - reviews.navigate
        - reviews.decide
        - reviews.discuss
        - reviews.request_changes
        - reviews.transcript
        - reviews.cancel
        - reviews.commit_message
        - reviews.commit
        - reviews.commits
        - options.get
        - models.list
        - fs.dirs
        - issues.list
        - reports.get
        - settings.get
        - settings.update
        - subscribe
        - unsubscribe
    ReviewSummary:
      type: object
      description: Same shape as the REST `ReviewSummary`.
      properties:
        id: {type: string}
        name: {type: string}
        workdir: {type: string}
        project_name: {type: string}
        task_id: {type: string}
        state: {type: string, enum: [active, closed]}
        cli: {type: string}
        model: {type: string}
        effort: {type: string}
        agent_session_id: {type: string}
        agent_running: {type: boolean}
        cursor: {type: [object, "null"]}
        commits: {type: integer}
        created_at: {type: string}
        updated_at: {type: string}
    TaskSummary:
      type: object
      description: Same slim payload as the REST list endpoint and the `task.changed` event.
      properties:
        id: {type: string}
        name: {type: string}
        workdir: {type: string}
        remote: {type: string}
        state:
          type: string
          enum: [draft, first_step, planning, planned, implementing, implemented, reviewing, fixing, finalizing, done, failed, paused, discarded]
        state_label: {type: string}
        automode: {type: boolean}
        origin: {type: string}
        profile: {type: string}
        scheduled_at: {type: string}
        schedule:
          type: object
          description: Derived pending start; status is empty when nothing is pending.
          properties:
            status: {type: string, enum: ["", future, overdue, waiting_parent]}
            at: {type: string}
            at_iso: {type: string}
            utc_offset: {type: string}
            parent_id: {type: string}
            parent_name: {type: string}
        parent_id: {type: string}
      required: [id, name, workdir, state, automode]
    CliSessionSummary:
      type: object
      description: Same payload as the REST session summary.
      properties:
        id: {type: string}
        name: {type: string}
        workdir: {type: string}
        project_name: {type: string}
        cli: {type: string}
        model: {type: string}
        effort: {type: string}
        cli_session_id: {type: string}
        state: {type: string, enum: [active, closed]}
        running: {type: boolean}
        turns: {type: integer}
        last_prompt: {type: string}
        last_error: {type: string}
        tokens:
          type: object
          properties:
            input: {type: integer}
            output: {type: integer}
        seconds: {type: integer}
        created_at: {type: string}
        updated_at: {type: string}
      required: [id, name, workdir, cli, state, running, turns]
  messages:
    Command:
      name: Command
      title: JSON-RPC request
      summary: Client request with `id`, `method` and `params`.
      payload:
        type: object
        properties:
          id:
            anyOf:
              - type: string
              - type: integer
              - type: "null"
          method:
            $ref: "#/components/schemas/MethodEnum"
          params:
            type: object
            additionalProperties: true
        required: [method]
      examples:
        - name: subscribe
          payload:
            id: 1
            method: subscribe
            params:
              topics: [tasks]
        - name: tasks.list
          payload:
            id: 2
            method: tasks.list
            params:
              state: done
        - name: tasks.list (last completed of a project)
          payload:
            id: 3
            method: tasks.list
            params:
              state: done
              project: GRAFENO
              sort: completed
              limit: 3
    Result:
      name: Result
      title: JSON-RPC success response
      payload:
        type: object
        properties:
          id:
            anyOf:
              - type: string
              - type: integer
              - type: "null"
          result:
            type: object
            additionalProperties: true
        required: [result]
    ErrorResult:
      name: ErrorResult
      title: JSON-RPC error response
      payload:
        type: object
        properties:
          id:
            anyOf:
              - type: string
              - type: integer
              - type: "null"
          error:
            type: object
            properties:
              message: {type: string}
              status: {type: integer}
            required: [message]
        required: [error]
      examples:
        - name: unknown method
          payload:
            id: 3
            error:
              message: "unknown method: foo"
        - name: api error with status
          payload:
            id: 4
            error:
              message: "task not found"
              status: 404
    TaskChanged:
      name: TaskChanged
      title: Push event delivered to `tasks` subscribers
      payload:
        type: object
        properties:
          event:
            type: string
            const: task.changed
          task:
            $ref: "#/components/schemas/TaskSummary"
        required: [event, task]
      examples:
        - name: state flip
          payload:
            event: task.changed
            task:
              id: 20260905-101126-slug
              name: Demo
              workdir: /repo/path
              remote: ""
              state: done
              state_label: Done
              automode: true
              origin: api
              scheduled_at: ""
              schedule: {status: "", at: "", at_iso: "", utc_offset: "", parent_id: "", parent_name: ""}
              parent_id: ""
    SessionChanged:
      name: SessionChanged
      title: Push event delivered to `sessions` subscribers
      payload:
        type: object
        properties:
          event:
            type: string
            const: session.changed
          session:
            $ref: "#/components/schemas/CliSessionSummary"
        required: [event, session]
    SessionDeleted:
      name: SessionDeleted
      title: Push event delivered when a CLI session is deleted
      payload:
        type: object
        properties:
          event:
            type: string
            const: session.deleted
          session_id: {type: string}
        required: [event, session_id]
    ReviewChanged:
      name: ReviewChanged
      title: Push event delivered to `reviews` subscribers
      payload:
        type: object
        properties:
          event:
            type: string
            const: review.changed
          review:
            $ref: "#/components/schemas/ReviewSummary"
        required: [event, review]
    ReviewDeleted:
      name: ReviewDeleted
      title: Push event delivered when a review is deleted
      payload:
        type: object
        properties:
          event:
            type: string
            const: review.deleted
          review_id: {type: string}
        required: [event, review_id]
