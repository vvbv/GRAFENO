openapi: 3.1.0
info:
  title: GRAFENO Remote API
  version: 1.5.0
  summary: REST API of the GRAFENO remote server (optional token authentication).
  description: |
    REST control API exposed by the GRAFENO TUI while it is running
    (`[api]` section of `~/.grafeno/config.toml`). The server lives only
    inside the TUI process as a worker; there is no standalone daemon.
    Authentication is OPTIONAL and dedicated to this server (it never
    shares nor overrides credentials with the Telegram bot or any other
    integration): when tokens are configured, requests must carry the
    shared token as `Authorization: Bearer <token>` or as the `?token=`
    query parameter (duplicate of `src/grafeno/server/auth.py`); when the
    token set is empty (the default), no authentication is required.
    Error payloads are always `{"error": "<message>"}`.
externalDocs:
  description: WebSocket protocol (AsyncAPI)
  url: ./asyncapi.yaml
servers:
  - url: http://127.0.0.1:8735
    description: Default local bind; host and port are configurable in `[api]`.
security:
  - BearerAuth: []
  - QueryToken: []
  - {}
tags:
  - name: status
    description: Server metadata.
  - name: tasks
    description: Task lifecycle, logs and artifacts.
  - name: sessions
    description: Direct CLI sessions - conversations with an agent CLI in a project folder, outside the task pipeline.
  - name: projects
    description: Projects - task workdirs and folders of the working directories, with task counts.
  - name: audio
    description: Audio synthesis (TTS) endpoint.
  - name: catalog
    description: New-task form options, model catalogue, directories and GitHub issues.
  - name: reports
    description: Usage reports (tokens, models, time and projects per period).
  - name: settings
    description: Global settings (same sections as the TUI settings screen).
paths:
  /api/v1/status:
    get:
      tags: [status]
      summary: Server metadata (version, uptime, pid and WS path).
      operationId: getStatus
      responses:
        "200":
          description: Server metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks:
    get:
      tags: [tasks]
      summary: List tasks with optional filters, ordering and pagination.
      operationId: listTasks
      parameters:
        - $ref: "#/components/parameters/TasksStateQuery"
        - $ref: "#/components/parameters/WorkdirQuery"
        - $ref: "#/components/parameters/ProjectQuery"
        - $ref: "#/components/parameters/TasksSortQuery"
        - $ref: "#/components/parameters/TasksOrderQuery"
        - $ref: "#/components/parameters/TasksLimitQuery"
        - $ref: "#/components/parameters/TasksOffsetQuery"
      responses:
        "200":
          description: Tasks wrapped under the `tasks` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          description: Unknown state, sort or order; limit/offset out of range or not integers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      tags: [tasks]
      summary: Create a task (DRAFT via automode).
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Created task summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCreateResponse"
        "400":
          description: Validation error (name/workdir required, rechain error, malformed attachments).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File larger than 500 MiB or request body above its cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}:
    get:
      tags: [tasks]
      summary: Full task detail (`to_dict()` plus derived fields).
      operationId: getTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail wrapped under the `task` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailResponse"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/projects:
    get:
      tags: [projects]
      summary: Task workdirs plus the folders found in the working directories, with task counts.
      description: |
        Items keep `workdir` and `count`; folders found in a working directory
        (first-level subfolders of each configured root) also carry `name` and
        `workspace`. `workspaces` lists the configured roots (global + project
        level of the TUI cwd) with their state. In remote session mode no folder
        is discovered and `session` is true.
      operationId: listProjects
      responses:
        "200":
          description: Projects wrapped under the `projects` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/logs:
    get:
      tags: [tasks]
      summary: Tail of the persisted live log of a task.
      operationId: getTaskLogs
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: One plain-text log line per array item.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "400":
          description: "`limit` out of range or not an integer."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found (checked before any content).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/artifacts:
    get:
      tags: [tasks]
      summary: Every `.md` file of a first/plan/review/final phase.
      operationId: getTaskArtifacts
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/KindQuery"
        - $ref: "#/components/parameters/CycleQuery"
      responses:
        "200":
          description: Markdown files of the requested phase.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactsResponse"
        "400":
          description: Missing `kind`, unknown `kind` or bad `cycle`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/start:
    post:
      tags: [tasks]
      summary: Start the full automode pipeline (stops after the plan when the task has `confirm_plan`).
      operationId: startTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Pipeline started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Task already running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: App unavailable (write op without the TUI runtime).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/resume:
    post:
      tags: [tasks]
      summary: Resume a FAILED task reusing the artifacts on disk.
      operationId: resumeTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Pipeline resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Task is not in FAILED state (or already running).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: App unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/restart:
    post:
      tags: [tasks]
      summary: Reset the task to DRAFT and start automode again.
      operationId: restartTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Pipeline restarted from scratch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Task already running (409 may also come from the runner check).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: App unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/pause:
    post:
      tags: [tasks]
      summary: Pause a running task (cancels the worker).
      operationId: pauseTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task paused; `state` becomes `paused`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStateResponse"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: App unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/discard:
    post:
      tags: [tasks]
      summary: Mark the task as DISCARDED (cancels any running pipeline first).
      operationId: discardTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task discarded; `state` becomes `discarded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStateResponse"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/mark-done:
    post:
      tags: [tasks]
      summary: Force-complete the task without running the rest of the pipeline.
      operationId: markTaskDone
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task completed; `state` becomes `done`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStateResponse"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/extend:
    post:
      tags: [tasks]
      summary: Start a new cycle on an existing task with a fresh request.
      operationId: extendTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExtendRequest"
      responses:
        "200":
          description: New cycle started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Empty `request`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: File larger than 500 MiB or request body above its cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: App unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/tasks/{task_id}/artifact:
    get:
      tags: [tasks]
      summary: One `.md` of a phase by its path relative to the phase root (any cycle), normalized like the TUI viewer.
      operationId: getTaskArtifactFile
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - $ref: "#/components/parameters/KindQuery"
        - {name: path, in: query, required: true, description: "Relative path, e.g. `plan.md` or `ciclo-02/plan.md`.", schema: {type: string}}
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactFileResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tasks/{task_id}/attachments:
    get:
      tags: [tasks]
      summary: Reference attachments of a task with their metadata.
      operationId: listTaskAttachments
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [tasks]
      summary: Add reference files (Word, Excel, PDF, images, video, ...) to an existing task.
      operationId: uploadTaskAttachments
      description: >-
        Does not start a cycle and does not touch the description; the files
        are listed to the agents from the next prompt on. Max 500 MiB per file.
        Large files should use the raw binary body (`?name=`): it is streamed
        to disk and never loaded in memory. The JSON/base64 body is capped at
        the base64 size of one 500 MiB file plus 1 MiB. The request is
        authorized before its body is read and `Expect: 100-continue` is honored.
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - {name: name, in: query, required: false, description: "Original file name; required with the binary body.", schema: {type: string}}
        - {name: cycle, in: query, required: false, description: "Cycle the files belong to (1..task cycle + 1); defaults to the current cycle. Binary body only.", schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attachments:
                  type: array
                  description: Max 10 entries.
                  items:
                    type: object
                    properties:
                      name: {type: string}
                      data: {type: string, format: byte}
                    required: [data]
              required: [attachments]
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "201":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: File larger than 500 MiB or request body above its cap.
        "507":
          description: Not enough disk space to store the upload.
    delete:
      tags: [tasks]
      summary: Remove one attachment.
      operationId: deleteTaskAttachment
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - {name: file, in: query, required: true, description: "Stored file name (media-NN.ext).", schema: {type: string}}
      responses:
        "200":
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The task is running (or discarded).
  /api/v1/tasks/{task_id}/media:
    get:
      tags: [tasks]
      summary: Raw file of the task media dir (any attached file); MIME type by extension, never HTML or SVG.
      operationId: getTaskMedia
      description: Streamed from disk (no Range support).
      parameters:
        - $ref: "#/components/parameters/TaskId"
        - {name: name, in: query, required: true, description: "File name as listed in the task detail `media`.", schema: {type: string}}
      responses:
        "200":
          description: OK.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/tasks/{task_id}/run:
    post:
      tags: [tasks]
      summary: Run one pipeline phase or the full automode (same checks as the TUI detail).
      operationId: runTaskPhase
      description: "`automode` respects `confirm_plan`: it stops after the plan and the task waits in `planned` for `approve-plan`."
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{task_id}/continue:
    post:
      tags: [tasks]
      summary: Continue a failed or interrupted task from the phase where it stopped (TUI `c`).
      operationId: continueTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{task_id}/approve-plan:
    post:
      tags: [tasks]
      summary: Approve the plan of a `planned` task, then implementation + review loop (plan confirmation point).
      operationId: approvePlan
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/tasks/{task_id}/reset:
    post:
      tags: [tasks]
      summary: Cancel any running execution and reset the task to `draft`, deleting its artifacts (TUI `R`).
      operationId: resetTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tasks/{task_id}/edit:
    post:
      tags: [tasks]
      summary: Edit name, description and/or chain parent (validated like the TUI rechain).
      operationId: editTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskEditRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/tasks/{task_id}/roles:
    post:
      tags: [tasks]
      summary: Change the agents (cli/model/effort per role) of a task, or apply a profile.
      operationId: updateTaskRoles
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRolesRequest"
      responses:
        "200":
          description: Done.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/options:
    get:
      tags: [catalog]
      summary: Defaults and choices of the new-task form (config defaults, profiles, hook stages, CLIs, session mode).
      operationId: getFormOptions
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OptionsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/models:
    get:
      tags: [catalog]
      summary: Models and effort variants per CLI (cached for 10 minutes; `refresh=1` reloads them).
      operationId: listModels
      parameters:
        - {name: refresh, in: query, required: false, schema: {type: string, enum: ["1", "true"]}}
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/fs/dirs:
    get:
      tags: [catalog]
      summary: Subdirectories for the workdir autocompletion (directory or partial path).
      operationId: listDirectories
      parameters:
        - {name: path, in: query, required: false, schema: {type: string}}
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/issues:
    get:
      tags: [catalog]
      summary: Open GitHub issues of a project (requires `gh` with access; empty otherwise).
      operationId: listIssues
      parameters:
        - {name: workdir, in: query, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/reports:
    get:
      tags: [reports]
      summary: Usage aggregated by day, CLI+model and project for a period (`period` wins over `from`/`to`; default today).
      operationId: getUsageReport
      parameters:
        - {name: period, in: query, required: false, schema: {type: string, enum: [day, week, month]}}
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
      responses:
        "200":
          description: OK.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/settings:
    get:
      tags: [settings]
      summary: Global settings; secrets are reported as `*_set` flags, never their value.
      operationId: getSettings
      responses:
        "200":
          description: Current settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [settings]
      summary: Save the sections present in the body (secrets are write-only; `<key>_clear` empties them).
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          description: Saved settings (same shape as GET).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/audio/speech:
    post:
      tags: [audio]
      summary: Synthesize speech (TTS) with the configured provider and download the audio file.
      description: The text is split into segments of under 200 characters and synthesized as a single WAV, with at most 800 characters spoken.
      operationId: synthesizeSpeech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: {type: string}
                format:
                  type: string
                  enum: [wav, ogg]
                  default: wav
                  description: ogg requires ffmpeg on the host.
              required: [text]
      responses:
        "200":
          description: Audio file (provider WAV, or OGG/OPUS when `format=ogg`).
          content:
            audio/wav:
              schema: {type: string, format: binary}
            audio/ogg:
              schema: {type: string, format: binary}
        "400":
          description: Missing text or unknown format.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid token (only enforced when tokens are configured).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: TTS provider error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: TTS not configured or OGG conversion unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/sessions:
    get:
      tags: [sessions]
      summary: List direct CLI sessions (optionally of one project).
      operationId: listSessions
      parameters:
        - name: workdir
          in: query
          required: false
          description: Only sessions of this project folder.
          schema:
            type: string
      responses:
        "200":
          description: Sessions, offered CLIs and availability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSessionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [sessions]
      summary: Create a direct CLI session (and optionally send the first prompt).
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliSessionCreateRequest"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions/{session_id}:
    get:
      tags: [sessions]
      summary: Session summary.
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Session wrapped under the `session` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [sessions]
      summary: Cancel a running turn and delete the session with its history.
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions/{session_id}/transcript:
    get:
      tags: [sessions]
      summary: Transcript entries after a sequence number.
      operationId: getSessionTranscript
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: after
          in: query
          required: false
          description: Return entries with `seq` greater than this value.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Keep only the last N entries of the result (0 = all, max 2000).
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Entries, total count and running flag.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSessionTranscriptResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/sessions/{session_id}/send:
    post:
      tags: [sessions]
      summary: Send a prompt (runs one agent turn resuming the native CLI session).
      operationId: sendSessionPrompt
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliSessionSendRequest"
      responses:
        "200":
          description: Updated session wrapped under the `session` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions/{session_id}/cancel:
    post:
      tags: [sessions]
      summary: Cancel the running turn.
      operationId: cancelSessionTurn
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Updated session wrapped under the `session` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions/{session_id}/edit:
    post:
      tags: [sessions]
      summary: Rename the session.
      operationId: editSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CliSessionEditRequest"
      responses:
        "200":
          description: Updated session wrapped under the `session` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions/{session_id}/close:
    post:
      tags: [sessions]
      summary: Close the session (rejected while a turn runs).
      operationId: closeSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Updated session wrapped under the `session` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/sessions/{session_id}/reopen:
    post:
      tags: [sessions]
      summary: Reopen a closed session.
      operationId: reopenSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Updated session wrapped under the `session` key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CliSessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  responses:
    BadRequest:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid token (only enforced when tokens are configured).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Task or file not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The action does not apply to the task right now (running, discarded, wrong state); the message is localized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: App unavailable (write op without the TUI runtime).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Token from the `[api].tokens` list or the `GRAFENO_API_TOKEN` env var (env wins). Only enforced when non-empty; exclusive credential of this server, unrelated to the Telegram bot token.
    QueryToken:
      type: apiKey
      in: query
      name: token
      description: Same optional token passed as a query parameter (browser/websocket friendly); only enforced when tokens are configured.
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      description: Direct CLI session identifier, e.g. `20261018-101500-a1b2c3`.
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      description: Task identifier, e.g. `20260905-101126-slug`.
      schema:
        type: string
    TasksStateQuery:
      name: state
      in: query
      required: false
      description: State filter; one state or a comma separated list (e.g. `done,discarded`).
      schema:
        type: string
    WorkdirQuery:
      name: workdir
      in: query
      required: false
      description: Absolute project folder; exact match after normalization (no trailing slash).
      schema:
        type: string
    ProjectQuery:
      name: project
      in: query
      required: false
      description: Project folder name; case-insensitive match against the last segment of the task workdir.
      schema:
        type: string
    TasksSortQuery:
      name: sort
      in: query
      required: false
      description: "`tree` keeps the chain order; the others return a flat list sorted by that timestamp."
      schema:
        type: string
        enum: [tree, created, updated, completed]
        default: tree
    TasksOrderQuery:
      name: order
      in: query
      required: false
      description: Sort direction; ignored with `sort=tree`.
      schema:
        type: string
        enum: [desc, asc]
        default: desc
    TasksLimitQuery:
      name: limit
      in: query
      required: false
      description: Page size (1..1000); omitted = every matching task.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    TasksOffsetQuery:
      name: offset
      in: query
      required: false
      description: Number of matching tasks to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
    LimitQuery:
      name: limit
      in: query
      required: false
      description: Max number of log lines (1..1000, default 200).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
    KindQuery:
      name: kind
      in: query
      required: true
      description: Artifact kind.
      schema:
        type: string
        enum: [first, plan, review, final]
    CycleQuery:
      name: cycle
      in: query
      required: false
      description: Artifact cycle number (default 1).
      schema:
        type: integer
        minimum: 1
        default: 1
  schemas:
    OkResponse:
      type: object
      properties:
        ok: {type: boolean}
      required: [ok]
    CliSessionSummary:
      type: object
      description: Summary of a direct CLI session; `running` is in-memory state of the current turn.
      properties:
        id: {type: string}
        name: {type: string}
        workdir: {type: string}
        project_name: {type: string}
        cli: {type: string, enum: [claude, opencode]}
        model: {type: string}
        effort: {type: string}
        cli_session_id: {type: string, description: Native session id of the CLI (resume key).}
        state: {type: string, enum: [active, closed]}
        running: {type: boolean}
        turns: {type: integer}
        last_prompt: {type: string}
        last_error: {type: string}
        tokens:
          type: object
          properties:
            input: {type: integer}
            output: {type: integer}
        seconds: {type: integer}
        created_at: {type: string}
        updated_at: {type: string}
      required: [id, name, workdir, cli, state, running, turns]
    CliSessionResponse:
      type: object
      properties:
        session:
          $ref: "#/components/schemas/CliSessionSummary"
      required: [session]
    CliSessionListResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/CliSessionSummary"
        clis:
          type: array
          items: {type: string}
        available:
          type: boolean
          description: False in remote session mode.
      required: [sessions, clis, available]
    CliSessionCreateRequest:
      type: object
      properties:
        workdir: {type: string, description: Absolute local project folder.}
        cli: {type: string, enum: [claude, opencode], default: claude}
        model: {type: string}
        effort: {type: string}
        name: {type: string}
        prompt: {type: string, description: Optional first prompt sent right after creation.}
      required: [workdir]
    CliSessionSendRequest:
      type: object
      properties:
        prompt: {type: string}
      required: [prompt]
    CliSessionEditRequest:
      type: object
      properties:
        name: {type: string}
      required: [name]
    CliSessionTranscriptEntry:
      type: object
      properties:
        seq: {type: integer, description: Global 1-based index of the entry.}
        turn: {type: integer}
        kind: {type: string, enum: [user, text, tool, info, error]}
        text: {type: string}
        ts: {type: string}
      required: [seq, turn, kind, text]
    CliSessionTranscriptResponse:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CliSessionTranscriptEntry"
        total: {type: integer}
        running: {type: boolean}
        session:
          $ref: "#/components/schemas/CliSessionSummary"
      required: [entries, total, running, session]
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    TaskState:
      type: string
      enum: [draft, first_step, planning, planned, implementing, implemented, reviewing, fixing, finalizing, done, failed, paused, discarded]
    RoleConfig:
      type: object
      properties:
        cli:
          type: string
        model:
          type: string
        effort:
          type: string
    TaskSummary:
      type: object
      description: Slim task payload used by list endpoints and WS events.
      properties:
        id:
          type: string
        name:
          type: string
        workdir:
          type: string
        remote:
          type: string
        state:
          $ref: "#/components/schemas/TaskState"
        state_label:
          type: string
        automode:
          type: boolean
        origin:
          type: string
        profile:
          type: string
        scheduled_at:
          type: string
        parent_id:
          type: string
        iteration: {type: integer}
        cycle: {type: integer}
        repeat_mode: {type: string}
        usage_waiting:
          type: boolean
          description: Waiting for the CLI usage quota to reset.
        running:
          type: boolean
          description: A pipeline of the task is running in this TUI.
        tokens:
          $ref: "#/components/schemas/TokenTotals"
        tokens_by_agent:
          type: object
          description: '"cli/model" -> [input, output].'
          additionalProperties:
            type: array
            items: {type: integer}
        duration_seconds: {type: integer}
        created_at: {type: string}
        updated_at: {type: string}
        completed_at:
          type: string
          description: Local ISO time the task last reached DONE (`last_completed_at`); falls back to `updated_at` for DONE tasks completed before it was recorded; empty otherwise.
        depth:
          type: integer
          description: Chain depth in the list endpoint (children follow their parent).
      required: [id, name, workdir, state, automode]
    TaskRaw:
      type: object
      description: Raw `Task` fields persisted in `task.toml`.
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        workdir: {type: string}
        remote: {type: string}
        remote_os: {type: string}
        state:
          $ref: "#/components/schemas/TaskState"
        automode: {type: boolean}
        max_iterations: {type: integer}
        test_command: {type: string}
        create_branch: {type: boolean}
        confirm_plan: {type: boolean}
        first_prompt: {type: string}
        final_prompt: {type: string}
        hook_command: {type: string}
        hook_stages: {type: string}
        hook_mode: {type: string}
        branch: {type: string}
        base_commit: {type: string}
        iteration: {type: integer}
        cycle: {type: integer}
        scheduled_at: {type: string}
        parent_id: {type: string}
        repeat_mode: {type: string}
        repeat_interval_minutes: {type: integer}
        plan_reuse: {type: string}
        repeat_count: {type: integer}
        last_completed_at: {type: string}
        origin: {type: string}
        profile: {type: string}
        failed_phase: {type: string}
        use_global_references: {type: boolean}
        use_project_references: {type: boolean}
        created_at: {type: string}
        updated_at: {type: string}
    TokenTotals:
      type: object
      properties:
        input: {type: integer}
        output: {type: integer}
    TaskDetail:
      type: object
      description: Full payload = `Task.to_dict()` plus derived fields.
      properties:
        task:
          $ref: "#/components/schemas/TaskRaw"
        first:
          $ref: "#/components/schemas/RoleConfig"
        planner:
          $ref: "#/components/schemas/RoleConfig"
        implementer:
          $ref: "#/components/schemas/RoleConfig"
        reviewer:
          $ref: "#/components/schemas/RoleConfig"
        final:
          $ref: "#/components/schemas/RoleConfig"
        sessions:
          type: object
        durations:
          type: object
        extensions:
          type: object
        tokens:
          type: object
        references:
          type: array
          items: {}
        state_label:
          type: string
        token_totals:
          $ref: "#/components/schemas/TokenTotals"
        total_duration_seconds:
          type: number
        phases:
          type: array
          description: Phases of the progress bar (`first` only when the task defines it).
          items: {type: string}
        phase_bar:
          type: array
          description: Progress bar as the TUI draws it (`status` pending/active/done per phase).
          items:
            type: object
            properties:
              key: {type: string}
              label: {type: string}
              status: {type: string, enum: [pending, active, done]}
        usage_waiting:
          type: boolean
          description: Waiting for the CLI usage quota to reset (transient, only while running).
        agents:
          type: array
          description: Agent and consumption per phase (TUI agents bar).
          items:
            type: object
            properties:
              phase: {type: string}
              label: {type: string}
              cli: {type: string}
              model: {type: string}
              effort: {type: string}
              tokens:
                oneOf:
                  - $ref: "#/components/schemas/TokenTotals"
                  - type: "null"
        tokens_by_phase:
          type: array
          items:
            type: object
            properties:
              phase: {type: string}
              label: {type: string}
              input: {type: integer}
              output: {type: integer}
        tokens_by_agent:
          type: array
          items:
            type: object
            properties:
              label: {type: string}
              input: {type: integer}
              output: {type: integer}
        runtime:
          type: object
          description: Live execution data of this TUI (activity bar).
          properties:
            running: {type: boolean}
            phase_label: {type: string}
            phase_elapsed_seconds: {type: integer}
            silence_seconds: {type: integer}
            event_count: {type: integer}
            pending_plan_confirm: {type: boolean}
            total_seconds: {type: integer}
        actions:
          type: object
          description: Which actions apply right now (same rules as the TUI detail).
          additionalProperties: {type: boolean}
        artifacts:
          type: object
          description: Relative `.md` paths per phase (`first`, `plan`, `review`, `final`), every cycle.
          additionalProperties:
            type: array
            items: {type: string}
        media:
          type: array
          items: {type: string}
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
        models_missing:
          type: array
          description: Roles pointing at a model the CLI no longer lists.
          items: {type: string}
        rechain_candidates:
          type: array
          items:
            type: object
            properties:
              id: {type: string}
              name: {type: string}
        remote_target: {type: string}
    TaskDetailResponse:
      type: object
      description: Wrapper with the task payload under the `task` key (see `actions.get_task`).
      properties:
        task:
          $ref: "#/components/schemas/TaskDetail"
    TaskCreateRequest:
      type: object
      properties:
        name: {type: string}
        workdir: {type: string}
        description: {type: string}
        automode:
          type: boolean
          default: true
        remote:
          type: string
          description: Remote project `user@host:/path` (then `workdir` is not needed). Ignored in session mode.
        parent_id:
          type: string
          description: Chain after this task. Any existing task is accepted (completed ones too); without `scheduled_at` the child is scheduled to now, so it starts unattended once the parent is DONE (immediately if it already is).
        scheduled_at:
          type: string
          description: Local `YYYY-MM-DD HH:MM` (or with `T`).
        repeat_mode:
          type: string
          enum: ["", interval, infinite]
          description: A repetitive task always runs in automode.
        repeat_interval_minutes: {type: integer, minimum: 1}
        plan_reuse:
          type: string
          enum: [reuse, replan, reevaluate]
        test_command: {type: string}
        first_prompt: {type: string}
        final_prompt: {type: string}
        confirm_plan: {type: boolean}
        create_branch: {type: boolean}
        hook_command: {type: string}
        hook_stages:
          description: List or comma-separated string of first/plan/implement/review/fix/final/tests.
          oneOf:
            - type: string
            - type: array
              items: {type: string}
        hook_mode:
          type: string
          enum: [override, both]
        use_global_references: {type: boolean}
        use_project_references: {type: boolean}
        references:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        origin: {type: string}
        profile:
          type: string
          description: >-
            Optional processing profile name; its roles override the global
            ones for this task only. Returns 400 if the profile is unknown.
        attachments:
          type: array
          description: >-
            Optional attachments persisted into the task's media dir and
            referenced from its description (image tokens for image suffixes,
            absolute paths otherwise). Audio files (ogg/oga/opus/mp3/wav/m4a/flac
            by file name) are additionally transcribed with the configured STT
            provider and their text is appended to the task description (see
            `transcriptions` in the response). Max 10 entries; each `data` is
            standard base64. Max 500 MiB per file; the JSON body is capped at the base64 size of one 500 MiB file plus 1 MiB. For files above 25 MiB prefer creating the task and uploading them with the raw body of `POST /api/v1/tasks/{task_id}/attachments`.
          items:
            type: object
            properties:
              name:
                type: string
                description: Original file name. Extension kept for images (png/jpg/jpeg/gif/webp), video (mp4/webm/mov/mkv/avi/m4v), audio, spreadsheets (xlsx/xlsm/xls/ods/csv/tsv), documents (docx/doc/odt/rtf/pdf/pptx/ppt/odp/txt/md), data (json/xml/yaml/yml/toml/sql/log) and archives (zip/tar/gz/tgz/7z); anything else is stored as .bin. The original name is kept in the attachments metadata.
              data:
                type: string
                format: byte
                description: Base64-encoded file content.
            required: [data]
      required: [name]
    TaskCreateResponse:
      type: object
      properties:
        task:
          $ref: "#/components/schemas/TaskSummary"
        transcriptions:
          type: array
          description: Per audio attachment, either {name, text} or {name, error}.
          items:
            type: object
    TaskListResponse:
      type: object
      properties:
        tasks:
          type: array
          description: Chain order by default (see `depth`); flat list (depth 0) when `sort` is not `tree`. Only the requested page.
          items:
            $ref: "#/components/schemas/TaskSummary"
        total:
          type: integer
          description: Number of tasks after filtering and before paging.
        offset:
          type: integer
          description: Offset applied to the filtered, sorted result.
        limit:
          type: [integer, "null"]
          description: Page size applied, or null when every task is returned.
        has_more:
          type: boolean
          description: True when more matching tasks exist after this page.
        done_hidden_ids:
          type: array
          description: Finished tasks that can be hidden without breaking a chain.
          items: {type: string}
    ProjectItem:
      type: object
      properties:
        workdir:
          type: string
          description: Project folder (task workdir or folder found in a working directory).
        count:
          type: integer
          description: Number of tasks whose workdir is this folder.
        name:
          type: string
          description: Folder name.
        workspace:
          type: string
          description: Resolved working directory where the folder was found; empty for workdirs only known from tasks.
    WorkspaceRoot:
      type: object
      properties:
        entry:
          type: string
          description: Working directory as configured (e.g. `~/code`).
        path:
          type: string
          description: Expanded and resolved absolute path (empty when it cannot be resolved).
        exists:
          type: boolean
          description: True when the path is an existing directory.
    ProjectListResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectItem"
        workspaces:
          type: array
          description: Configured working directories; empty in remote session mode.
          items:
            $ref: "#/components/schemas/WorkspaceRoot"
        session:
          type: boolean
          description: True in remote session mode (folder discovery skipped).
    StatusResponse:
      type: object
      properties:
        version: {type: string}
        uptime_seconds: {type: integer}
        pid: {type: integer}
        ws_path:
          type: string
          example: /api/v1/ws
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          default: true
    OkStateResponse:
      type: object
      properties:
        ok:
          type: boolean
          default: true
        state:
          type: string
          description: Resulting state (`paused`, `discarded` or `done`).
    ExtendRequest:
      type: object
      properties:
        request:
          type: string
          description: Free-text request for the new cycle.
        attachments:
          type: array
          description: >-
            Optional files saved to the task media and referenced in the request
            (same shape as task creation). Max 500 MiB per file; the JSON body is
            capped at the base64 size of one 500 MiB file plus 1 MiB. For big
            files upload them first with the raw body of
            `POST /api/v1/tasks/{task_id}/attachments?cycle=<task cycle + 1>`.
          items:
            type: object
            properties:
              name: {type: string}
              data: {type: string, format: byte}
      required: [request]
    Attachment:
      type: object
      properties:
        file: {type: string}
        name: {type: string}
        kind: {type: string, enum: [image, video, audio, spreadsheet, document, data, archive, other]}
        size: {type: integer}
        origin: {type: string}
        cycle: {type: integer}
        added_at: {type: string}
        path: {type: string}
    AttachmentsResponse:
      type: object
      properties:
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"
    LogsResponse:
      type: object
      properties:
        logs:
          type: array
          items:
            type: string
        entries:
          type: array
          description: Same lines with their TUI style (e.g. `bold red`, `cyan`, `dim`).
          items:
            type: object
            properties:
              text: {type: string}
              style: {type: string}
    ArtifactsResponse:
      type: object
      properties:
        kind:
          type: string
          enum: [first, plan, review, final]
        cycle:
          type: integer
        files:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              content: {type: string}
    ArtifactFileResponse:
      type: object
      properties:
        kind: {type: string}
        path: {type: string}
        content: {type: string}
    Reference:
      type: object
      properties:
        name: {type: string}
        description: {type: string}
        path:
          type: string
          description: Local directory or URL.
    RunRequest:
      type: object
      properties:
        phase:
          type: string
          enum: [plan, implement, review, fix, final, tests, automode]
      required: [phase]
    TaskEditRequest:
      type: object
      description: Only the present fields change.
      properties:
        name: {type: string}
        description: {type: string}
        parent_id:
          type: string
          description: Empty = unchain (root).
    TaskRolesRequest:
      type: object
      properties:
        roles:
          type: object
          description: Keys first/planner/implementer/reviewer/final.
          additionalProperties:
            $ref: "#/components/schemas/RoleConfig"
        profile:
          type: string
          description: Alone, copies the profile roles; with `roles`, kept only when they match.
    Profile:
      type: object
      properties:
        name: {type: string}
        summary: {type: string}
        roles:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RoleConfig"
    OptionsResponse:
      type: object
      properties:
        defaults:
          type: object
          properties:
            workdir: {type: string}
            automode: {type: boolean}
            confirm_plan: {type: boolean}
            create_branch: {type: boolean}
            test_command: {type: string}
            first_prompt: {type: string}
            final_prompt: {type: string}
            roles:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/RoleConfig"
            roles_summary:
              type: string
              description: "Compact cli/model summary of the global roles (same format as Profile.summary)."
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        hook_stages:
          type: array
          items: {type: string}
        known_clis:
          type: array
          items: {type: string}
        session_clis:
          type: array
          items: {type: string}
        available_clis:
          type: array
          items: {type: string}
        session:
          type: object
          properties:
            active: {type: boolean}
            label: {type: string}
    ModelsResponse:
      type: object
      properties:
        models:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        variants:
          type: object
          description: cli -> model -> effort levels.
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items: {type: string}
    DirsResponse:
      type: object
      properties:
        path: {type: string}
        parent: {type: string}
        exists: {type: boolean}
        dirs:
          type: array
          items: {type: string}
    IssuesResponse:
      type: object
      properties:
        available: {type: boolean}
        issues:
          type: array
          items:
            type: object
            properties:
              number: {type: integer}
              title: {type: string}
              body: {type: string}
    ReportResponse:
      type: object
      properties:
        from: {type: string, format: date}
        to: {type: string, format: date}
        tokens:
          $ref: "#/components/schemas/TokenTotals"
        seconds: {type: integer}
        tasks: {type: integer}
        projects: {type: integer}
        by_day:
          type: array
          items:
            type: object
            properties:
              date: {type: string}
              input: {type: integer}
              output: {type: integer}
              seconds: {type: integer}
        by_model:
          type: array
          items:
            type: object
            properties:
              label: {type: string}
              input: {type: integer}
              output: {type: integer}
        by_project:
          type: array
          items:
            type: object
            properties:
              project: {type: string}
              input: {type: integer}
              output: {type: integer}
              seconds: {type: integer}
              tasks: {type: integer}
    Settings:
      type: object
      description: >-
        Global settings, same sections as the TUI settings screen. On save,
        only the present sections change. Secrets (`telegram.bot_token`,
        `telegram.stt_key`, `telegram.tts_key`, `api.tokens`) are write-only:
        GET returns `<key>_set`, a non-empty value replaces them and
        `<key>_clear: true` empties them. `telegram.parser_cli`,
        `parser_model`, `parser_effort` and `parser_timeout` apply at once to
        the running bot; the rest of `[telegram]` and `[api]` applies on the
        next TUI start.
      properties:
        roles:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RoleConfig"
        automode:
          type: object
          properties:
            enabled: {type: boolean}
            max_iterations: {type: integer, minimum: 1}
            test_command: {type: string}
            create_branch: {type: boolean}
            confirm_plan: {type: boolean}
        auto_update: {type: boolean}
        self_update: {type: boolean}
        first_prompt: {type: string}
        final_prompt: {type: string}
        hook:
          type: object
          properties:
            command: {type: string}
            stages:
              type: array
              items: {type: string}
        editor:
          type: object
          properties:
            enabled: {type: boolean}
            editor: {type: string}
            mode: {type: string, enum: [window, split, none]}
            side: {type: string, enum: [left, right]}
        language: {type: string, enum: [en, es]}
        prompt_language:
          type: string
          description: Empty = same as the GUI language.
        workspaces:
          type: array
          description: Working directories (root folders whose first-level subfolders are the projects). On update a comma-separated string is also accepted; entries are normalized and deduplicated.
          items: {type: string}
        references:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        triggers:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              description: {type: string}
              phases:
                type: string
                description: "`all` or comma-separated stages."
              timing: {type: string, enum: [before, after]}
              workdir: {type: string}
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/Profile"
        telegram:
          type: object
          additionalProperties: true
          properties:
            parser_cli: {type: string, description: 'Empty means the planner role CLI.'}
            parser_model: {type: string}
            parser_effort: {type: string}
            parser_timeout:
              type: integer
              minimum: 30
              maximum: 3600
              default: 300
              description: Base parser timeout in seconds; long messages get extra time.
        api:
          type: object
          properties:
            enabled: {type: boolean}
            host: {type: string}
            port: {type: integer}
            tokens_set: {type: boolean}
