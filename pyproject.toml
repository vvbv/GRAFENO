[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grafeno"
version = "1.3.0"
description = "Multi-CLI TUI orchestrator for programming tasks (plan -> implementation -> review -> final steps)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.86",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
grafeno = "grafeno.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grafeno = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
