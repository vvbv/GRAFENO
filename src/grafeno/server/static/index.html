<!doctype html>
<html lang="__GRAFENO_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Grafeno</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --border: #dde1e6; --text: #1d2330;
  --muted: #667085; --accent: #2f6fdf; --accent-text: #ffffff;
  --danger: #c2372e; --ok: #1f8a4c; --warn: #b7791f; --row-hover: #eef2f8;
  --row-active: #dfe8fa; --code-bg: #f1f3f6;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #12151b; --panel: #1a1e26; --border: #2c323d; --text: #e4e7ec;
    --muted: #98a2b3; --accent: #5b8def; --accent-text: #0b0e13;
    --danger: #ef6b61; --ok: #4cc27f; --warn: #e2b04a; --row-hover: #222834;
    --row-active: #26324a; --code-bg: #141821;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column;
}
header {
  display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--panel); border-bottom: 1px solid var(--border);
}
header h1 { font-size: 16px; margin: 0; letter-spacing: .04em; }
header .version { color: var(--muted); font-size: 12px; }
header .spacer { flex: 1; }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.live { background: var(--ok); }
.dot.polling { background: var(--warn); }
.dot.offline { background: var(--danger); }
button, select, input, textarea {
  font: inherit; color: inherit; background: var(--panel);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px;
}
button { cursor: pointer; white-space: nowrap; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
button.danger { color: var(--danger); }
button.link { border: none; background: none; color: var(--accent); padding: 4px 6px; }
main { flex: 1; display: flex; min-height: 0; }
#list-pane {
  width: 44%; min-width: 320px; display: flex; flex-direction: column;
  border-right: 1px solid var(--border); background: var(--panel);
}
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.filters input[type=search] { flex: 1 1 160px; min-width: 0; }
.filters select { flex: 1 1 120px; min-width: 0; }
.filters label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.table-wrap { flex: 1; overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 600; font-size: 12px; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--row-hover); }
tbody tr.active { background: var(--row-active); }
td.project { color: var(--muted); font-size: 12px; word-break: break-all; }
.empty { padding: 24px; color: var(--muted); text-align: center; }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--border); white-space: nowrap;
}
.badge.done { color: var(--ok); border-color: var(--ok); }
.badge.failed { color: var(--danger); border-color: var(--danger); }
.badge.run { color: var(--accent); border-color: var(--accent); }
.badge.paused, .badge.discarded { color: var(--muted); }
#detail-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#detail-empty { margin: auto; color: var(--muted); }
#detail { display: none; flex: 1; flex-direction: column; min-height: 0; }
.detail-head { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
.detail-head h2 { margin: 0 0 6px; font-size: 17px; word-break: break-word; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--panel); }
.tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 8px 10px; color: var(--muted); }
.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-body { flex: 1; overflow: auto; padding: 14px 16px; }
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: var(--muted); font-size: 13px; }
pre {
  margin: 0 0 14px; padding: 10px 12px; background: var(--code-bg); border: 1px solid var(--border);
  border-radius: 6px; white-space: pre-wrap; word-break: break-word;
  font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
h3.file { font-size: 13px; margin: 0 0 6px; color: var(--muted); }
dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
dt { color: var(--muted); }
dd { margin: 0; word-break: break-word; white-space: pre-line; }
.back { display: none; }
dialog {
  border: 1px solid var(--border); border-radius: 10px; background: var(--panel); color: var(--text);
  padding: 0; width: min(560px, calc(100vw - 32px));
}
dialog::backdrop { background: rgba(0, 0, 0, .45); }
dialog form { display: flex; flex-direction: column; gap: 10px; padding: 18px; }
dialog h3 { margin: 0 0 4px; }
dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
dialog label.check { flex-direction: row; align-items: center; gap: 8px; }
dialog textarea { min-height: 120px; resize: vertical; }
dialog .row { display: flex; gap: 16px; flex-wrap: wrap; }
dialog .buttons { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
.help { font-size: 12px; color: var(--muted); }
#toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
.toast {
  background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--ok);
  border-radius: 6px; padding: 8px 12px; max-width: 380px; box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
}
.toast.error { border-left-color: var(--danger); }
@media (max-width: 760px) {
  #list-pane { width: 100%; min-width: 0; border-right: none; }
  #detail-pane { display: none; }
  body.show-detail #list-pane { display: none; }
  body.show-detail #detail-pane { display: flex; }
  .back { display: inline-block; }
  header { gap: 8px; padding: 8px 12px; }
  header .version, #status-text { display: none; }
  td.project, th.project { display: none; }
}
</style>
</head>
<body>
<header>
  <h1>GRAFENO</h1>
  <span class="version" id="version"></span>
  <span class="spacer"></span>
  <span class="status"><span class="dot" id="status-dot"></span><span id="status-text"></span></span>
  <button class="link" id="logout" hidden></button>
  <button class="primary" id="new-task"></button>
</header>
<main>
  <section id="list-pane">
    <div class="filters">
      <input type="search" id="f-search">
      <select id="f-state"></select>
      <select id="f-project"></select>
      <label><input type="checkbox" id="f-hide-done"><span id="f-hide-done-label"></span></label>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th id="h-name"></th><th class="project" id="h-project"></th><th id="h-state"></th></tr></thead>
        <tbody id="task-rows"></tbody>
      </table>
      <div class="empty" id="list-empty" hidden></div>
    </div>
  </section>
  <section id="detail-pane">
    <div id="detail-empty"></div>
    <div id="detail">
      <div class="detail-head">
        <button class="link back" id="back"></button>
        <h2 id="d-name"></h2>
        <span class="badge" id="d-state"></span>
        <div class="actions" id="d-actions"></div>
      </div>
      <nav class="tabs" id="d-tabs"></nav>
      <div class="tab-body" id="d-body"></div>
    </div>
  </section>
</main>

<dialog id="create-dialog">
  <form method="dialog" id="create-form">
    <h3 id="c-title"></h3>
    <label><span id="c-name-label"></span><input name="name" required maxlength="200"></label>
    <label><span id="c-workdir-label"></span><input name="workdir" required list="c-projects"></label>
    <datalist id="c-projects"></datalist>
    <label><span id="c-description-label"></span><textarea name="description"></textarea></label>
    <label><span id="c-profile-label"></span><input name="profile"><span class="help" id="c-profile-help"></span></label>
    <label><span id="c-parent-label"></span><select name="parent_id" id="c-parent"></select></label>
    <label><span id="c-attachments-label"></span><input type="file" name="attachments" multiple></label>
    <div class="row">
      <label class="check"><input type="checkbox" name="automode" checked><span id="c-automode-label"></span></label>
      <label class="check"><input type="checkbox" name="start_now" checked><span id="c-start-label"></span></label>
    </div>
    <div class="buttons">
      <button type="button" id="c-cancel"></button>
      <button type="submit" class="primary" id="c-submit"></button>
    </div>
  </form>
</dialog>

<dialog id="extend-dialog">
  <form method="dialog" id="extend-form">
    <h3 id="e-title"></h3>
    <label><span id="e-label"></span><textarea name="request" required></textarea></label>
    <div class="buttons">
      <button type="button" id="e-cancel"></button>
      <button type="submit" class="primary" id="e-submit"></button>
    </div>
  </form>
</dialog>

<dialog id="token-dialog">
  <form method="dialog" id="token-form">
    <h3 id="t-title"></h3>
    <p class="help" id="t-help"></p>
    <label><span id="t-label"></span><input name="token" type="password" autocomplete="current-password" required></label>
    <div class="buttons"><button type="submit" class="primary" id="t-submit"></button></div>
  </form>
</dialog>

<div id="toasts"></div>

<script>
"use strict";
const BOOT = /*__GRAFENO_I18N__*/null;
const S = BOOT.strings;
const tr = (key) => S[key] || key;
const $ = (id) => document.getElementById(id);
const TOKEN_KEY = "grafeno.token";
const RUNNING = new Set(["first_step", "planning", "implementing", "reviewing", "fixing", "finalizing"]);
const TERMINAL = new Set(["done", "discarded"]);
const ART_TABS = ["first", "plan", "review", "final"];

const state = {
  token: "", tasks: [], projects: [], selected: null, detail: null,
  tab: "info", cycle: 1, ws: null, wsLive: false, pollTimer: null, logTimer: null,
};

// ------------------------------------------------------------------ token
function readStoredToken() {
  try { return sessionStorage.getItem(TOKEN_KEY) || localStorage.getItem(TOKEN_KEY) || ""; } catch (e) { return ""; }
}
function storeToken(token) {
  state.token = token;
  try { if (token) localStorage.setItem(TOKEN_KEY, token); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  $("logout").hidden = !token;
}
function initToken() {
  const params = new URLSearchParams(location.search);
  const fromUrl = params.get("token");
  if (fromUrl) {
    storeToken(fromUrl);
    params.delete("token");
    const query = params.toString();
    history.replaceState(null, "", location.pathname + (query ? "?" + query : "") + location.hash);
  } else {
    storeToken(readStoredToken());
  }
}
function askToken() {
  const dialog = $("token-dialog");
  if (!dialog.open) dialog.showModal();
}

// ------------------------------------------------------------------ api
class ApiFailure extends Error {
  constructor(status, message) { super(message); this.status = status; }
}
async function api(method, path, body) {
  const headers = {};
  if (state.token) headers["Authorization"] = "Bearer " + state.token;
  const init = { method, headers };
  if (body !== undefined) {
    headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  let response;
  try {
    response = await fetch(path, init);
  } catch (err) {
    setStatus("offline");
    throw new ApiFailure(0, String(err));
  }
  const text = await response.text();
  let data = {};
  try { data = text ? JSON.parse(text) : {}; } catch (e) { data = {}; }
  if (response.status === 401) {
    askToken();
    throw new ApiFailure(401, data.error || "unauthorized");
  }
  if (!response.ok) throw new ApiFailure(response.status, data.error || response.statusText);
  return data;
}
function toast(message, isError) {
  const node = document.createElement("div");
  node.className = "toast" + (isError ? " error" : "");
  node.textContent = message;
  $("toasts").appendChild(node);
  setTimeout(() => node.remove(), isError ? 7000 : 3500);
}
function fail(err) {
  if (err && err.status === 401) return;
  toast(tr("web.ui.error") + ": " + (err && err.message ? err.message : err), true);
}

// ------------------------------------------------------------------ status
function setStatus(kind) {
  $("status-dot").className = "dot " + kind;
  $("status-text").textContent = tr("web.ui." + kind);
}

// ------------------------------------------------------------------ list
function badgeClass(stateValue) {
  if (stateValue === "done") return "badge done";
  if (stateValue === "failed") return "badge failed";
  if (RUNNING.has(stateValue)) return "badge run";
  if (stateValue === "paused" || stateValue === "discarded") return "badge " + stateValue;
  return "badge";
}
function projectLabel(task) {
  return task.remote ? task.remote : task.workdir;
}
function filteredTasks() {
  const text = $("f-search").value.trim().toLowerCase();
  const wanted = $("f-state").value;
  const project = $("f-project").value;
  const hideDone = $("f-hide-done").checked;
  return state.tasks.filter((task) => {
    if (wanted && task.state !== wanted) return false;
    if (project && task.workdir !== project) return false;
    if (hideDone && TERMINAL.has(task.state)) return false;
    if (text && !(task.name + " " + task.workdir + " " + task.id).toLowerCase().includes(text)) return false;
    return true;
  });
}
function renderList() {
  const rows = $("task-rows");
  rows.replaceChildren();
  const tasks = filteredTasks();
  for (const task of tasks) {
    const tr_ = document.createElement("tr");
    if (task.id === state.selected) tr_.className = "active";
    const name = document.createElement("td");
    name.textContent = task.name;
    const project = document.createElement("td");
    project.className = "project";
    project.textContent = projectLabel(task);
    const st = document.createElement("td");
    const badge = document.createElement("span");
    badge.className = badgeClass(task.state);
    badge.textContent = task.state_label || tr("state." + task.state);
    st.appendChild(badge);
    tr_.append(name, project, st);
    tr_.addEventListener("click", () => selectTask(task.id));
    rows.appendChild(tr_);
  }
  $("list-empty").hidden = tasks.length > 0;
}
function renderProjectFilter() {
  const select = $("f-project");
  const current = select.value;
  select.replaceChildren(new Option(tr("web.ui.all_projects"), ""));
  const datalist = $("c-projects");
  datalist.replaceChildren();
  for (const project of state.projects) {
    select.appendChild(new Option(project.workdir + " (" + project.count + ")", project.workdir));
    datalist.appendChild(new Option(project.workdir));
  }
  select.value = state.projects.some((p) => p.workdir === current) ? current : "";
}
async function loadTasks() {
  const data = await api("GET", "/api/v1/tasks");
  state.tasks = data.tasks || [];
  renderList();
}
async function loadProjects() {
  const data = await api("GET", "/api/v1/projects");
  state.projects = data.projects || [];
  renderProjectFilter();
}
async function refreshAll() {
  try {
    await Promise.all([loadTasks(), loadProjects()]);
    if (!state.wsLive) setStatus("polling");
    if (state.selected) await loadDetail(false);
  } catch (err) {
    fail(err);
  }
}

// ------------------------------------------------------------------ detail
function selectTask(taskId) {
  state.selected = taskId;
  state.tab = "info";
  state.cycle = 1;
  document.body.classList.add("show-detail");
  renderList();
  loadDetail(true).catch(fail);
}
async function loadDetail(full) {
  if (!state.selected) return;
  const data = await api("GET", "/api/v1/tasks/" + encodeURIComponent(state.selected));
  state.detail = data.task;
  const task = state.detail.task;
  if (full) state.cycle = Math.max(1, task.cycle || 1);
  $("detail-empty").style.display = "none";
  $("detail").style.display = "flex";
  $("d-name").textContent = task.name;
  const badge = $("d-state");
  badge.className = badgeClass(task.state);
  badge.textContent = state.detail.state_label || tr("state." + task.state);
  renderActions(task);
  renderTabs();
  const logStalled = state.tab === "log" && !state.logTimer && RUNNING.has(task.state);
  if (full || logStalled || state.tab === "info" || state.tab === "description") await renderTab();
}
function actionButton(label, handler, options) {
  const button = document.createElement("button");
  button.textContent = label;
  if (options && options.danger) button.className = "danger";
  if (options && options.primary) button.className = "primary";
  if (options && options.disabled) button.disabled = true;
  button.addEventListener("click", handler);
  return button;
}
async function runAction(path, confirmKey, body) {
  if (confirmKey && !confirm(tr(confirmKey))) return;
  try {
    await api("POST", "/api/v1/tasks/" + encodeURIComponent(state.selected) + "/" + path, body);
    toast(tr("web.ui.done_ok"));
    await refreshAll();
  } catch (err) {
    fail(err);
  }
}
function renderActions(task) {
  const box = $("d-actions");
  box.replaceChildren();
  const running = RUNNING.has(task.state);
  box.append(
    actionButton(tr("web.ui.start"), () => runAction("start"), { primary: true, disabled: running || TERMINAL.has(task.state) }),
    actionButton(tr("web.ui.resume"), () => runAction("resume"), { disabled: task.state !== "failed" }),
    actionButton(tr("web.ui.pause"), () => runAction("pause"), { disabled: !running }),
    actionButton(tr("web.ui.extend"), openExtend, { disabled: running }),
    actionButton(tr("web.ui.restart"), () => runAction("restart", "web.ui.confirm_restart"), { disabled: running }),
    actionButton(tr("web.ui.mark_done"), () => runAction("mark-done", "web.ui.confirm_mark_done"), { disabled: task.state === "done" }),
    actionButton(tr("web.ui.discard"), () => runAction("discard", "web.ui.confirm_discard"), { danger: true, disabled: task.state === "discarded" }),
  );
}
function renderTabs() {
  const nav = $("d-tabs");
  nav.replaceChildren();
  const tabs = ["info", "description", "log"].concat(ART_TABS);
  for (const tab of tabs) {
    const button = document.createElement("button");
    button.textContent = tr("web.ui.tab_" + tab);
    if (tab === state.tab) button.className = "active";
    button.addEventListener("click", () => { state.tab = tab; renderTabs(); renderTab().catch(fail); });
    nav.appendChild(button);
  }
}
function formatDuration(seconds) {
  seconds = Math.round(seconds || 0);
  const h = Math.floor(seconds / 3600), m = Math.floor((seconds % 3600) / 60), s = seconds % 60;
  if (h) return h + "h " + String(m).padStart(2, "0") + "m " + String(s).padStart(2, "0") + "s";
  if (m) return m + "m " + String(s).padStart(2, "0") + "s";
  return s + "s";
}
function formatTokens(value) {
  if (value >= 1e6) return (value / 1e6).toFixed(1) + "M";
  if (value >= 1e3) return (value / 1e3).toFixed(1) + "k";
  return String(value || 0);
}
function infoList(pairs) {
  const dl = document.createElement("dl");
  for (const [label, value] of pairs) {
    if (value === "" || value === null || value === undefined) continue;
    const dt = document.createElement("dt");
    dt.textContent = label;
    const dd = document.createElement("dd");
    dd.textContent = value;
    dl.append(dt, dd);
  }
  return dl;
}
function renderInfo(body) {
  const detail = state.detail;
  const task = detail.task;
  const yesNo = (flag) => tr(flag ? "web.ui.yes" : "web.ui.no");
  const roles = ["first", "planner", "implementer", "reviewer", "final"]
    .filter((role) => detail[role] && detail[role].cli)
    .map((role) => role + ": " + detail[role].cli + (detail[role].model ? " / " + detail[role].model : ""))
    .join("\n");
  body.appendChild(infoList([
    [tr("web.ui.field_id"), task.id],
    [tr("web.ui.field_state"), detail.state_label],
    [tr("web.ui.field_workdir"), task.workdir],
    [tr("web.ui.field_remote"), task.remote],
    [tr("web.ui.field_profile"), task.profile],
    [tr("web.ui.field_origin"), task.origin],
    [tr("web.ui.field_automode"), yesNo(task.automode)],
    [tr("web.ui.field_cycle"), String(task.cycle)],
    [tr("web.ui.field_iteration"), String(task.iteration)],
    [tr("web.ui.field_branch"), task.branch],
    [tr("web.ui.field_scheduled"), task.scheduled_at],
    [tr("web.ui.field_parent"), task.parent_id],
    [tr("web.ui.field_failed_phase"), task.failed_phase],
    [tr("web.ui.field_tokens"), formatTokens(detail.token_totals.input) + " / " + formatTokens(detail.token_totals.output)],
    [tr("web.ui.field_duration"), formatDuration(detail.total_duration_seconds)],
    [tr("web.ui.field_created"), task.created_at],
    [tr("web.ui.field_updated"), task.updated_at],
    [tr("web.ui.field_roles"), roles],
  ]));
}
function preBlock(text) {
  const pre = document.createElement("pre");
  pre.textContent = text;
  return pre;
}
async function renderLog(body) {
  const toolbar = document.createElement("div");
  toolbar.className = "toolbar";
  toolbar.appendChild(actionButton(tr("web.ui.refresh"), () => renderTab().catch(fail)));
  body.appendChild(toolbar);
  const data = await api("GET", "/api/v1/tasks/" + encodeURIComponent(state.selected) + "/logs?limit=500");
  const lines = data.logs || [];
  if (!lines.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = tr("web.ui.no_log");
    body.appendChild(empty);
    return;
  }
  body.appendChild(preBlock(lines.join("\n")));
  const pane = $("d-body");
  pane.scrollTop = pane.scrollHeight;
}
async function renderArtifacts(body, kind) {
  const task = state.detail.task;
  const toolbar = document.createElement("div");
  toolbar.className = "toolbar";
  const label = document.createElement("span");
  label.textContent = tr("web.ui.cycle");
  const select = document.createElement("select");
  for (let cycle = 1; cycle <= Math.max(1, task.cycle || 1); cycle++) select.appendChild(new Option(String(cycle), String(cycle)));
  select.value = String(state.cycle);
  select.addEventListener("change", () => { state.cycle = Number(select.value); renderTab().catch(fail); });
  toolbar.append(label, select, actionButton(tr("web.ui.refresh"), () => renderTab().catch(fail)));
  body.appendChild(toolbar);
  const path = "/api/v1/tasks/" + encodeURIComponent(state.selected) + "/artifacts?kind=" + kind + "&cycle=" + state.cycle;
  const data = await api("GET", path);
  const files = data.files || [];
  if (!files.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = tr("web.ui.no_files");
    body.appendChild(empty);
    return;
  }
  for (const file of files) {
    const title = document.createElement("h3");
    title.className = "file";
    title.textContent = file.name;
    body.append(title, preBlock(file.content));
  }
}
async function renderTab() {
  clearInterval(state.logTimer);
  state.logTimer = null;
  const pane = $("d-body");
  const body = document.createElement("div");
  if (state.tab === "info") renderInfo(body);
  else if (state.tab === "description") body.appendChild(preBlock(state.detail.task.description || ""));
  else if (state.tab === "log") {
    await renderLog(body);
    if (RUNNING.has(state.detail.task.state)) {
      state.logTimer = setInterval(() => { if (state.tab === "log") renderTab().catch(fail); }, 4000);
    }
  } else await renderArtifacts(body, state.tab);
  const keepBottom = state.tab === "log";
  pane.replaceChildren(body);
  if (keepBottom) pane.scrollTop = pane.scrollHeight;
}

// ------------------------------------------------------------------ dialogs
function openCreate() {
  const form = $("create-form");
  form.reset();
  const parent = $("c-parent");
  parent.replaceChildren(new Option(tr("web.ui.parent_none"), ""));
  for (const task of state.tasks) {
    if (!TERMINAL.has(task.state)) parent.appendChild(new Option(task.name + " (" + task.id + ")", task.id));
  }
  const project = $("f-project").value;
  if (project) form.elements.workdir.value = project;
  $("create-dialog").showModal();
}
function readFileBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",", 2)[1] || "");
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function submitCreate(event) {
  event.preventDefault();
  const form = event.target;
  const submit = $("c-submit");
  submit.disabled = true;
  try {
    const payload = {
      name: form.elements.name.value.trim(),
      workdir: form.elements.workdir.value.trim(),
      description: form.elements.description.value,
      automode: form.elements.automode.checked,
    };
    if (form.elements.profile.value.trim()) payload.profile = form.elements.profile.value.trim();
    if (form.elements.parent_id.value) payload.parent_id = form.elements.parent_id.value;
    const files = Array.from(form.elements.attachments.files || []);
    if (files.length) {
      payload.attachments = [];
      for (const file of files) payload.attachments.push({ name: file.name, data: await readFileBase64(file) });
    }
    const data = await api("POST", "/api/v1/tasks", payload);
    for (const item of data.transcriptions || []) {
      if (item.error) toast(tr("web.ui.transcription_failed") + " " + item.name + ": " + item.error, true);
    }
    const created = data.task;
    if (form.elements.start_now.checked && !payload.parent_id) {
      await api("POST", "/api/v1/tasks/" + encodeURIComponent(created.id) + "/start");
    }
    $("create-dialog").close();
    toast(tr("web.ui.created"));
    await refreshAll();
    selectTask(created.id);
  } catch (err) {
    fail(err);
  } finally {
    submit.disabled = false;
  }
}
function openExtend() {
  $("extend-form").reset();
  $("extend-dialog").showModal();
}
async function submitExtend(event) {
  event.preventDefault();
  const request = event.target.elements.request.value.trim();
  if (!request) return;
  $("extend-dialog").close();
  await runAction("extend", null, { request });
}
async function submitToken(event) {
  event.preventDefault();
  storeToken(event.target.elements.token.value.trim());
  $("token-dialog").close();
  event.target.reset();
  connectWs();
  await refreshAll();
}

// ------------------------------------------------------------------ live events
function connectWs() {
  if (state.ws) { try { state.ws.close(); } catch (e) {} }
  const scheme = location.protocol === "https:" ? "wss://" : "ws://";
  const query = state.token ? "?token=" + encodeURIComponent(state.token) : "";
  let socket;
  try { socket = new WebSocket(scheme + location.host + "/api/v1/ws" + query); } catch (e) { return; }
  state.ws = socket;
  socket.onopen = () => {
    socket.send(JSON.stringify({ id: 1, method: "subscribe", params: { topics: ["tasks"] } }));
    state.wsLive = true;
    setStatus("live");
  };
  socket.onmessage = (message) => {
    let data;
    try { data = JSON.parse(message.data); } catch (e) { return; }
    if (data.event === "task.changed" && data.task) {
      const index = state.tasks.findIndex((task) => task.id === data.task.id);
      if (index >= 0) state.tasks[index] = data.task; else state.tasks.unshift(data.task);
      renderList();
      if (data.task.id === state.selected) loadDetail(false).catch(fail);
    }
  };
  socket.onclose = () => {
    if (state.ws !== socket) return;
    state.wsLive = false;
    state.ws = null;
    setStatus("polling");
    setTimeout(connectWs, 5000);
  };
}

// ------------------------------------------------------------------ boot
function applyStrings() {
  document.title = tr("web.ui.title");
  $("version").textContent = "v" + BOOT.version;
  $("new-task").textContent = tr("web.ui.new_task");
  $("logout").textContent = tr("web.ui.logout");
  $("f-search").placeholder = tr("web.ui.search");
  const stateSelect = $("f-state");
  stateSelect.appendChild(new Option(tr("web.ui.all_states"), ""));
  for (const value of BOOT.states) stateSelect.appendChild(new Option(tr("state." + value), value));
  $("f-hide-done-label").textContent = tr("web.ui.hide_done");
  $("h-name").textContent = tr("web.ui.col_name");
  $("h-project").textContent = tr("web.ui.col_project");
  $("h-state").textContent = tr("web.ui.col_state");
  $("list-empty").textContent = tr("web.ui.empty");
  $("detail-empty").textContent = tr("web.ui.select");
  $("back").textContent = tr("web.ui.back");
  $("c-title").textContent = tr("web.ui.new_task");
  $("c-name-label").textContent = tr("web.ui.name");
  $("c-workdir-label").textContent = tr("web.ui.workdir");
  $("c-description-label").textContent = tr("web.ui.description");
  $("c-profile-label").textContent = tr("web.ui.profile");
  $("c-profile-help").textContent = tr("web.ui.profile_help");
  $("c-parent-label").textContent = tr("web.ui.parent");
  $("c-attachments-label").textContent = tr("web.ui.attachments");
  $("c-automode-label").textContent = tr("web.ui.automode");
  $("c-start-label").textContent = tr("web.ui.start_now");
  $("c-cancel").textContent = tr("web.ui.cancel");
  $("c-submit").textContent = tr("web.ui.submit");
  $("e-title").textContent = tr("web.ui.extend_title");
  $("e-label").textContent = tr("web.ui.extend_label");
  $("e-cancel").textContent = tr("web.ui.cancel");
  $("e-submit").textContent = tr("web.ui.submit");
  $("t-title").textContent = tr("web.ui.token_title");
  $("t-help").textContent = tr("web.ui.token_help");
  $("t-label").textContent = tr("web.ui.token_label");
  $("t-submit").textContent = tr("web.ui.token_submit");
}
function bind() {
  for (const id of ["f-search", "f-state", "f-project", "f-hide-done"]) $(id).addEventListener("input", renderList);
  $("new-task").addEventListener("click", openCreate);
  $("create-form").addEventListener("submit", submitCreate);
  $("c-cancel").addEventListener("click", () => $("create-dialog").close());
  $("extend-form").addEventListener("submit", submitExtend);
  $("e-cancel").addEventListener("click", () => $("extend-dialog").close());
  $("token-form").addEventListener("submit", submitToken);
  $("token-dialog").addEventListener("cancel", (event) => event.preventDefault());
  $("back").addEventListener("click", () => {
    document.body.classList.remove("show-detail");
    state.selected = null;
    renderList();
  });
  $("logout").addEventListener("click", () => {
    storeToken("");
    if (state.ws) state.ws.close();
    askToken();
  });
}
applyStrings();
bind();
initToken();
setStatus("polling");
connectWs();
refreshAll();
// Fallback polling: keeps the list fresh when the WebSocket is down and
// refreshes the project counts (not carried by task.changed events).
state.pollTimer = setInterval(() => { if (!state.wsLive || document.visibilityState === "visible") refreshAll(); }, 15000);
</script>
